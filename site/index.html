<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omar Rashwan</title>
  <meta name="description" content="Omar Rashwan — software engineer, low-level systems and graphics.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://omarrashwan.com/">
  <meta property="og:title" content="Omar Rashwan">
  <meta property="og:description" content="Software engineer — low-level systems & graphics.">
  <meta property="og:image" content="https://omarrashwan.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Omar Rashwan's intro beside a dithered painting of his dog on a mountain summit">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="fonts/ibm-plex-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* IBM Plex Mono, self-hosted (SIL OFL 1.1, see fonts/OFL.txt). */
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap;
      src: url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");
    }
    @font-face {
      font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: swap;
      src: url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2");
    }
    :root {
      --bg: #0e0e0e;
      --fg: #d4d4d0;
      --muted: #6b6b66;
      --rule: #262624;
      --accent: #e5383b;
      --dim: #3d3d3a;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f2f1ed; --fg: #1c1c1a; --muted: #85847e; --rule: #dcdbd5; --dim: #bab9b2; }
    }
    * { box-sizing: border-box; margin: 0; }
    html { background: var(--bg); color: var(--fg); }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font: 15px/1.6 "IBM Plex Mono", ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      background-image: radial-gradient(var(--rule) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    main {
      width: 100%; max-width: 960px;
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
      gap: 48px; align-items: center;
    }
    #dog { display: block; width: 100%; position: relative; }
    /* Crop marks: an L at each corner, just outside the image. */
    #dog::before {
      content: ""; position: absolute; inset: -10px; pointer-events: none;
      --m: var(--muted);
      background:
        linear-gradient(var(--m), var(--m)) top left / 14px 1px,
        linear-gradient(var(--m), var(--m)) top left / 1px 14px,
        linear-gradient(var(--m), var(--m)) top right / 14px 1px,
        linear-gradient(var(--m), var(--m)) top right / 1px 14px,
        linear-gradient(var(--m), var(--m)) bottom left / 14px 1px,
        linear-gradient(var(--m), var(--m)) bottom left / 1px 14px,
        linear-gradient(var(--m), var(--m)) bottom right / 14px 1px,
        linear-gradient(var(--m), var(--m)) bottom right / 1px 14px;
      background-repeat: no-repeat;
    }
    #dog img {
      display: block; width: 100%; height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* While the animation downloads: show the small first frame instead of
         an empty box, and keep the alt text for screen readers but not on screen. */
      background: url(dog-still.webp) center / 100% 100% no-repeat;
      color: transparent;
    }
    @media (max-width: 760px) {
      main { grid-template-columns: minmax(0, 1fr); gap: 32px; }
      #dog { max-width: 420px; justify-self: center; order: -1; }
    }
    .prompt { color: var(--muted); }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    p { color: var(--muted); }
    .prompt ~ .prompt { margin-top: 24px; }
    /* nl: right-aligned line numbers in a dim gutter. */
    .lines { list-style: none; padding: 0; counter-reset: line; }
    .lines li { color: var(--muted); counter-increment: line; }
    .lines li::before {
      content: counter(line); color: var(--dim);
      display: inline-block; width: 2ch; margin-right: 2ch; text-align: right;
    }
    nav { margin-top: 24px; }
    .cursor {
      display: inline-block;
      width: 0.6em; height: 1.1em;
      vertical-align: text-bottom;
      background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    /* Each prompt appears at --d, its command (--n characters) types in from
       --t with a text-colored cursor riding along, and the cursor stays until
       --e, when the next prompt (or the final red cursor) takes over. The
       finished page is the default state, so without animations everything is
       simply there and the stray cursors stay hidden. */
    .type {
      display: inline-block; vertical-align: bottom; overflow: hidden; white-space: nowrap;
      width: calc(var(--n) * 1ch);
      animation: type calc(var(--n) * 55ms) steps(var(--n)) var(--t) both;
    }
    @keyframes type { from { width: 0; } }
    .prompt[style*="--t"]::after {
      content: ""; display: inline-block; visibility: hidden;
      width: 0.6em; height: 1.1em; vertical-align: text-bottom;
      background: currentColor;
      animation: caret calc(var(--e) - var(--d)) var(--d) forwards;
    }
    @keyframes caret { from { visibility: visible; } to { visibility: hidden; } }
    .out { animation: show 0s var(--d) both; }
    @keyframes show { from { visibility: hidden; } }
    .fade { animation: fade 0.8s ease var(--d) both; }
    @keyframes fade { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .type, .out, .fade, .prompt::after { animation: none; } }
    a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--rule); }
    a:hover { border-color: var(--accent); }
    nav { display: flex; gap: 20px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <section>
      <p class="prompt" style="--d:0s; --t:.35s; --n:6; --e:.8s">&gt; <span class="type">whoami</span></p>
      <div class="out" style="--d:.8s">
        <h1>Omar Rashwan</h1>
        <p>Software engineer — low-level systems &amp; graphics</p>
      </div>
      <p class="prompt out" style="--d:.8s; --t:1.05s; --n:28; --e:2.95s">&gt; <span class="type">head -n 4 interests.txt | nl</span></p>
      <ol class="lines out" style="--d:2.75s">
        <li>fixed gear cycling</li>
        <li>coffee</li>
        <li>outdoor exploration</li>
        <li>technology (obviously)</li>
      </ol>
      <p class="prompt out" style="--d:2.95s; --t:3.2s; --n:6; --e:3.65s">&gt; <span class="type">status</span></p>
      <p class="out" style="--d:3.65s">Rebuilding from scratch <span class="cursor" aria-hidden="true"></span></p>
      <nav class="fade" style="--d:4s">
        <a href="https://github.com/omrash">github</a>
      </nav>
    </section>
    <picture id="dog">
      <source srcset="dog-still.webp" media="(prefers-reduced-motion: reduce)">
      <img src="dog.webp" width="420" height="414" alt="My dog on a mountain summit, painted and dithered">
    </picture>
  </main>
</body>
</html>
