# The 404 page shows the missing path relative to ~ (the site root), so
# /projects/raytracer becomes projects/raytracer. It's the decoded path
# ($uri, so %20 shows as a space and the query string is dropped), saved in
# $orig_uri before error_page swaps $uri for /404.html.
map $orig_uri $rel_path {
    "~^/(.*)$" $1;
    default    $orig_uri;
}

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    # /resume serves resume.html.
    try_files $uri $uri.html $uri/ =404;

    # Runs again after the internal redirect to /404.html, so only set it once.
    uninitialized_variable_warn off;
    if ($orig_uri = "") {
        set $orig_uri $uri;
    }

    # Missing pages get a shell error naming the path they asked for.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        ssi on;
    }
    # Otherwise try_files would serve the raw template for /404.
    location = /404 {
        return 404;
    }

    gzip on;
    gzip_types image/svg+xml text/css application/javascript;
}
