name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # Sent by the private resume repo when the resume changes.
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check out the resume source (private)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/resume
          ssh-key: ${{ secrets.RESUME_DEPLOY_KEY }}
          path: resume-data

      - name: Build the resume page and PDF
        run: python3 resume-data/build.py --site site --html site/resume.html --pdf site/resume.pdf

      # Cloudflare and browsers cache style.css for hours; a new link each deploy
      # means new pages never pair with an old stylesheet.
      - name: Version the stylesheet link
        run: sed -i 's|href="style.css"|href="style.css?v=${{ github.run_number }}"|' site/*.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/my-site:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Watchtower Update
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.WATCHTOWER_TOKEN }}" \
               https://omarrashwan.com/v1/update
        continue-on-error: true
